<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculadora</title>
</head>
<body>
    <div class="janela">
        <h1 class="janela-calculadora"></h1>
    </div>
    <div class="corpo-calculadora">

    </div>


    <button class="botao1" id="1">1</button>
    <button class="botao1" id="2">2</button>
    <button class="botao1" id="3">3</button>
    <button class="botao2" id="4">4</button>
    <button class="botao2" id="5">5</button>
    <button class="botao2" id="6">6</button>
    <button class="botaoespecial" id="7">7</button>
    <button class="botao3" id="8">8</button>
    <button class="botao3" id="9">9</button>
    <button class="botao4" id="0">0</button>
    <button class="botaoC" id="clear">C</button>
    <button class="botao5 mais" id="+">+</button>
    <button class="botao5 menos" id="-">-</button>
    <button class="botao5 multiplicacao" id="*">*</button>
    <button class="botao5 divisao" id="/">÷</button>
    <button class="botao6" id="=">=</button>

    <p id="resultado"></p>

</body>
</html>
